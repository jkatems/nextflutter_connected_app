name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile
      - name: Vérifier le format Dart
        run: dart format --output=none --set-exit-if-changed lib test scripts
      - name: Analyser le code
        run: flutter analyze --no-pub
      - name: Tester Flutter, Provider et l’intégration HTTP réelle
        run: flutter test --no-pub --coverage --concurrency=2
      - name: Tester le backend HTTP
        run: python -m unittest discover -s backend -v
      - name: Exiger au moins 80 % de couverture des lignes instrumentées
        run: python scripts/check_coverage.py --min-total 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compiler l’APK de démonstration pour émulateur Android
        run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://10.0.2.2:8000
      - uses: actions/upload-artifact@v4
        with:
          name: carnet-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
